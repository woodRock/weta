[package]
name = "weta-data"
description = "Datasets and data loaders for weta, including MNIST and CIFAR-10"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["download"]
download = ["dep:ureq", "dep:flate2"]

[dependencies]
weta-core.workspace = true
weta-tensor.workspace = true
weta-autograd.workspace = true
ureq = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
